name: Build iOS app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: xcodebuild -project RemoteView.xcodeproj -scheme RemoteView -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/RemoteView.app ipa/Payload/
          cd ipa
          zip -r ../RemoteView.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteView-iOS-unsigned-ipa
          path: RemoteView.ipa
