<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Browser Remote</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Phone Browser Remote</h1>
<section class="card"><label>Pairing code</label><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="connect">Connect</button></div><div id="status">Disconnected</div></section>
<section class="browser card">
<div class="row"><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><input id="url" placeholder="https://example.com"><button id="go">Go</button></div>
<div class="screen-wrap"><img id="screen" alt="iPhone browser screen"></div>
<div class="row controls"><button id="scrollUp">↑ Scroll</button><button id="scrollDown">↓ Scroll</button><input id="typeText" placeholder="Type into focused field"><button id="type">Type</button></div>
<p class="muted">Tap the phone screen image to click webpage elements.</p>
</section></main><script src="app.js"></script></body></html>
