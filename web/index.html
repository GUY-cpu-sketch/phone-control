<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Control</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Phone Control</h1><p class="muted">iPhone screen viewer</p><section class="card"><label>Pairing code</label><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><label>WebSocket URL</label><input id="url" value="ws://localhost:8787/ws"><button id="connect">Connect</button><span id="status">Disconnected</span></section><section class="screen"><img id="screen" alt="iPhone screen stream"></section><div class="controls"><button data-cmd="home">Home</button><button data-cmd="back">Back</button><button data-cmd="lock">Lock</button></div></main><script src="app.js"></script></body></html>
